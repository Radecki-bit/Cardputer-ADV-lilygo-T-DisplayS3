name: PlatformIO CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build lilygo-t-display-s3 target
        run: pio run -e lilygo-t-display-s3

      - name: Build m5stack-cardputer-adv target
        run: pio run -e m5stack-cardputer-adv
