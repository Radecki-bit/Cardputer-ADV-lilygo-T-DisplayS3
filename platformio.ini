[platformio]
default_envs = lilygo-t-display-s3

[env:lilygo-t-display-s3]
platform = espressif32 @ 6.6.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    lovyan03/LovyanGFX @ ^1.1.16

[env:m5stack-cardputer-adv]
platform = espressif32 @ 6.6.0
board = esp32-s3-devkitc-1
framework = arduino
src_dir = examples/adv_master
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    m5stack/M5Cardputer @ ^1.0.2
    lovyan03/LovyanGFX @ ^1.1.16
