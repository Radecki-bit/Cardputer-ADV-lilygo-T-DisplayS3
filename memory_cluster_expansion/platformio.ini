[platformio]
default_envs = esp_with_antenna, esp_without_antenna

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio

[env:esp_with_antenna]
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -O3
    -DWHOAMI_EXT_ANTENNA=1
    -DWHOAMI_NODE_ROLE=2
    -DWHOAMI_TX_POWER_QDBM=80
    -DWHOAMI_RF_FREQ_MHZ=2442
    -DWHOAMI_WIFI_CHANNEL=7

[env:esp_without_antenna]
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -O3
    -DWHOAMI_EXT_ANTENNA=0
    -DWHOAMI_NODE_ROLE=3
    -DWHOAMI_TX_POWER_QDBM=70
    -DWHOAMI_RF_FREQ_MHZ=2442
    -DWHOAMI_WIFI_CHANNEL=7
